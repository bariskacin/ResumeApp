<div class="app-shell">
  <header class="app-header">
    <a routerLink="/" class="logo" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <span>Resume</span>App
    </a>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
      <a routerLink="/builder" routerLinkActive="active">Builder</a>
      <a routerLink="/auth" routerLinkActive="active" *ngIf="!isLoggedIn()">Sign in</a>
      <button *ngIf="isLoggedIn()" type="button" (click)="logout()">Sign out</button>
      <a routerLink="/builder" class="primary-link">Start free</a>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
